# Render Blueprint: deploys the Task Tracker as two web services.
# Dashboard -> New -> Blueprint -> pick this repo, and Render creates both.
services:
  - type: web
    name: task-tracker-api
    runtime: docker
    rootDir: Task-Tracker-CLI
    plan: free
    healthCheckPath: /api/tasks
    envVars:
      - key: CORS_ORIGIN
        value: "*"

  - type: web
    name: task-tracker-web
    runtime: docker
    rootDir: task-tracker-web
    plan: free
    envVars:
      # Free Render services cannot talk over the private network, so nginx
      # proxies /api/* to the API's PUBLIC URL. Change it if your API URL differs.
      - key: TASK_API_URL
        value: https://task-tracker-api-fak9.onrender.com
