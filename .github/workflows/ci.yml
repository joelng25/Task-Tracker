name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task-Tracker-CLI
    steps:
      - uses: actions/checkout@v4
      - name: Install GoogleTest
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev
      - run: make task-server
      - run: make run-tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-tracker-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Smoke test
        run: |
          docker compose up -d
          for i in $(seq 1 20); do curl -sf localhost:8080/api/tasks && break; sleep 1; done
          curl -sf -X POST localhost:8080/api/tasks -H 'Content-Type: application/json' -d '{"description":"ci"}'
          curl -sf localhost:3000 | grep -q '<div id="root">'
          docker compose down
